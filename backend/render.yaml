services:
  - type: web
    name: club-newbery-backend
    env: node
    plan: free
    buildCommand: npm install && npx prisma db push
    startCommand: node index.js
    envVars:
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        sync: false
      - key: MP_ACCESS_TOKEN
        sync: false
