services:
  - type: web
    name: club-newbery-backend
    env: node
    plan: free
    region: oregon              # Región más cercana a Argentina con plan free
    rootDir: backend            # Directorio raíz del backend en el monorepo
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health    # Endpoint dedicado con verificación de DB
    envVars:
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false       # REQUERIDO: URL de PostgreSQL (Render Dashboard)
      - key: JWT_SECRET
        sync: false       # REQUERIDO: Clave fuerte >= 64 caracteres (Render Dashboard)
      - key: MP_ACCESS_TOKEN
        sync: false       # REQUERIDO para pagos: Token real MercadoPago (Render Dashboard)
      - key: FRONTEND_URL
        value: https://frontend-indol-rho-38.vercel.app
      - key: NODE_ENV
        value: production
