databases:
  - name: club-newbery-db
    plan: free                  # Base de datos PostgreSQL creada en Render

services:
  - type: web
    name: club-newbery          # Web Service Render
    env: node
    plan: free
    region: oregon              # Región gratuita de Render
    rootDir: backend            # Directorio raíz del backend en el monorepo
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health    # Endpoint dedicado con verificación de DB
    envVars:
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: club-newbery-db
          property: connectionString
      - key: JWT_SECRET
        sync: false       # REQUERIDO: Clave fuerte >= 64 caracteres (Render Dashboard)
      - key: MP_ACCESS_TOKEN
        sync: false       # REQUERIDO para pagos: Token real MercadoPago (Render Dashboard)
      - key: FRONTEND_URL
        value: https://frontend-indol-rho-38.vercel.app
      - key: NODE_ENV
        value: production
      - key: GCLOUD_PROJECT
        value: club-newbery-digital
