# Firebase App Hosting — Configuración de Next.js
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  concurrency: 80
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 10

# ─── Variables de entorno de producción ───────────────────────────────────────
# ⚠️ REEMPLAZAR: Completar con los valores reales de tu proyecto Firebase
env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: REEMPLAZAR_CON_API_KEY
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: REEMPLAZAR_CON_PROJECT_ID.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: REEMPLAZAR_CON_PROJECT_ID
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: REEMPLAZAR_CON_PROJECT_ID.appspot.com
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: REEMPLAZAR_CON_MESSAGING_SENDER_ID
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: REEMPLAZAR_CON_APP_ID
    availability:
      - BUILD
      - RUNTIME

  # URL del backend en Cloud Functions
  - variable: NEXT_PUBLIC_API_URL
    value: https://us-central1-REEMPLAZAR_CON_PROJECT_ID.cloudfunctions.net/api
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_APP_ENV
    value: production
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_DEMO_MODE
    value: "false"
    availability:
      - BUILD
      - RUNTIME
